            </div>
            <div x-show="searchResults.length > 0" @click.away="searchResults = []"
                 class="absolute z-50 w-full mt-1 glass-card !p-2" style="border-radius: 12px; max-height: 280px; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.3);">
              <template x-for="(item, idx) in searchResults" :key="item.code">
                <div @click="selectSearchResult(item)" 
                     class="flex items-center justify-between px-3 py-2.5 rounded-lg cursor-pointer transition-colors hover:bg-indigo-500/10"
                     :class="{'bg-indigo-500/20': selectedSearchIdx === idx}"
                     @mouseenter="selectedSearchIdx = idx">
                  <div class="flex items-center gap-3">
                    <span class="font-medium text-sm" x-text="item.name"></span>
                    <span class="text-xs stat-label" x-text="item.code"></span>
                    <span class="market-tag text-xs" :class="'market-' + item.market" x-text="item.market.toUpperCase()"></span>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-mono hidden sm:inline" x-text="item.pinyin"></span>
                    <span x-show="item.alreadyTracked" class="text-xs text-amber-500">✓ 已追踪</span>
                  </div>
                </div>
              </template>
            </div>
          </div>
          <p class="text-xs stat-label mt-1">输入后点击搜索或按回车</p>
        </div>

        <!-- Search Result Preview -->
        <div x-show="searchedStock" class="glass-card mb-5 !p-4" style="border-radius: 14px;">
          <template x-if="searchedStock.error">
            <p class="text-red-500 text-sm" x-text="searchedStock.error"></p>
          </template>
          <template x-if="!searchedStock.error && searchedStock.name">
            <div>
              <div class="flex items-center gap-2 mb-2">
                <span class="font-bold text-lg" x-text="searchedStock.name"></span>
                <span class="market-tag" :class="'market-' + searchedStock.market" x-text="searchedStock.market.toUpperCase()"></span>
                <span class="stat-label text-sm" x-text="searchedStock.code"></span>
              </div>
              <div class="flex items-baseline gap-3">
                <span class="text-2xl font-bold" x-text="formatPrice(joinPrice)"></span>
                <span class="stat-label text-sm" x-show="joinDate !== todayStr" x-text="'(' + joinDate + ' 收盘价)'"></span>
                <span class="stat-label text-sm" x-show="joinDate === todayStr">(实时价)</span>
              </div>
              <template x-if="searchedStock.alreadyTracked">
                <p class="text-amber-500 text-sm mt-2">⚠️ 这只股票已在追踪列表中</p>
              </template>
            </div>
          </template>
        </div>

        <!-- Step 2: Join Date -->
        <div class="mb-5">
          <label class="block text-sm font-medium mb-2 stat-label">加入日期</label>
          <input type="date" x-model="joinDate" @change="recalcJoinPrice()" :max="todayStr"
                 class="input-field">
        </div>

        <!-- Step 3: Category -->
        <div class="mb-5">
          <label class="block text-sm font-medium mb-2 stat-label">所属分类 (选填)</label>
          <select x-model="newStockCategoryId" class="input-field appearance-none">
            <option value="">— 不选择 (未分类) —</option>
            <template x-for="cat in categories" :key="cat.id">
              <option :value="cat.id" x-text="cat.name"></option>
            </template>
          </select>
        </div>

        <!-- Step 4: Reason -->
        <div class="mb-6">
          <label class="block text-sm font-medium mb-2 stat-label">加入理由 (选填)</label>
          <textarea x-model="newStock.reason" rows="3" 
                    placeholder="为什么关注这只股票？"
                    class="input-field resize-none"></textarea>
        </div>

        <button @click="addStock()" :disabled="addingStock || !searchedStock?.name || searchedStock?.alreadyTracked || !(newStock.code || searchedStock?.code)" 
                class="btn-primary w-full justify-center text-lg py-4">
          <span x-show="addingStock" class="spinner"></span>
          <span x-show="!addingStock">✓ 确认添加</span>
        </button>
      </div>
    </div>

    <!-- Edit Stock Modal -->
    <div class="modal-overlay" :class="{ 'active': showEditModal }" @click.self="closeEditModal()">
      <div class="modal-content">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl sm:text-2xl font-bold gradient-text">编辑股票</h2>
          <button @click="closeEditModal()" class="text-2xl opacity-40 hover:opacity-70 transition-opacity">✕</button>
        </div>

        <template x-if="editingStock">
          <div class="space-y-4">
            <!-- Stock Info Preview -->
            <div class="glass-card !p-4" style="border-radius: 14px;">
              <div class="flex items-center gap-2 mb-1">
                <span class="font-bold text-base" x-text="editingStock.name"></span>
                <span class="market-tag" :class="'market-' + editingStock.market" x-text="editingStock.market.toUpperCase()"></span>
                <span class="text-sm stat-label" x-text="editingStock.code"></span>
              </div>
              <div class="flex items-baseline gap-2">
                <span class="text-xl font-bold" x-text="formatPrice(editingStock.current_price)"></span>
                <span class="text-sm" :class="(editingStock.change_percent || 0) >= 0 ? 'price-up' : 'price-down'"
                      x-text="formatPercent(editingStock.change_percent)"></span>
              </div>
            </div>

            <!-- Edit: Name -->
            <div>
              <label class="block text-sm font-medium mb-2 stat-label">股票名称</label>
              <input type="text" x-model="editForm.name" class="input-field">
            </div>

            <!-- Edit: Reason -->
            <div>
              <label class="block text-sm font-medium mb-2 stat-label">加入理由</label>
              <textarea x-model="editForm.reason" rows="2" class="input-field resize-none"></textarea>
            </div>

            <!-- Edit: Notes -->
            <div>
              <label class="block text-sm font-medium mb-2 stat-label">备注 (个人笔记)</label>
              <textarea x-model="editForm.notes" rows="3" 
                        placeholder="记录你的个人观察、操作计划等..." 
                        class="input-field resize-none"></textarea>
            </div>

            <!-- Edit: Tag -->
            <div>
              <label class="block text-sm font-medium mb-2 stat-label">标签标注</label>
              <div class="flex gap-2 flex-wrap">
                <template x-for="t in stockTags" :key="t.value">
                  <button @click="editForm.tag = editForm.tag === t.value ? '' : t.value"
                          class="stock-tag text-xs px-3 py-1.5 rounded-md cursor-pointer transition-all"
                          :class="[t.value, editForm.tag === t.value ? 'ring-2 ring-offset-1 ring-indigo-500' : 'opacity-60 hover:opacity-100']"
                          x-text="t.label"
                          style="font-size:0.8rem;border:none;"></button>
                </template>
              </div>
            </div>

            <!-- Edit: Alert -->
            <div>
              <label class="block text-sm font-medium mb-2 stat-label">⚠️ 价格预警</label>
              <div class="flex items-center gap-3">
                <select x-model="editForm.alert_mode" class="input-field" style="padding:10px 12px;width:auto;flex-shrink:0;">
                  <option value="percent-down">📉 跌超 %</option>
                  <option value="percent-up">📈 涨超 %</option>
                  <option value="price-down">📉 跌至 ¥</option>
                  <option value="price-up">📈 涨至 ¥</option>
                </select>
                <input type="number" x-model="editForm.alert_threshold" :step="editForm.alert_mode?.startsWith('price') ? '0.01' : '0.1'"
                       :placeholder="editForm.alert_mode?.startsWith('price') ? '目标价' : '百分比'" class="input-field" style="padding:10px 12px;width:110px;">
                <button @click="editForm.alert_threshold = null; editForm.alert_mode = 'percent-down'"
                        class="btn-danger text-xs py-1.5 px-3" style="flex-shrink:0;">清除</button>
              </div>
              <p class="text-xs stat-label mt-1">
                <span x-show="editForm.alert_threshold !== null && editForm.alert_threshold !== ''">
                  当 <span x-text="editForm.alert_mode === 'percent-down' || editForm.alert_mode === 'percent-up' ? '加入至今涨幅' : '当前价格'"></span>
                  <span x-text="editForm.alert_mode === 'percent-down' || editForm.alert_mode === 'price-down' ? '≤' : '≥'"></span>
                  <b x-text="editForm.alert_threshold + (editForm.alert_mode?.startsWith('price') ? '' : '%')"></b> 时触发预警
                </span>
                <span x-show="editForm.alert_threshold === null || editForm.alert_threshold === ''">未设置价格预警</span>
              </p>
              <div x-show="editingStock?.alert_triggered" class="mt-1">
                <span class="alert-badge">⚠️ 预警已触发</span>
                <button @click="resetAlert(editingStock.id)" class="text-xs text-indigo-400 ml-2">复位预警</button>
              </div>
            </div>

            <!-- Edit: Category -->
            <div>
              <label class="block text-sm font-medium mb-2 stat-label">所属分类</label>
              <select x-model="editForm.category_id" class="input-field appearance-none">
                <option :value="null">— 未分类 —</option>
                <template x-for="cat in categories" :key="cat.id">
                  <option :value="cat.id" x-text="cat.name"></option>
                </template>
              </select>
            </div>

            <button @click="saveEdit()" :disabled="savingEdit" 
                    class="btn-primary w-full justify-center text-lg py-4">
              <span x-show="savingEdit" class="spinner"></span>
              <span x-show="!savingEdit">✓ 保存修改</span>
            </button>
          </div>
        </template>
      </div>
    </div>

    <!-- Category Management Modal -->
    <div class="modal-overlay" :class="{ 'active': showCategoryModal }" @click.self="closeCategoryModal()">
      <div class="modal-content">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl sm:text-2xl font-bold gradient-text">分类管理</h2>
          <button @click="closeCategoryModal()" class="text-2xl opacity-40 hover:opacity-70 transition-opacity">✕</button>
        </div>

        <!-- Add New Category -->
        <div class="mb-6">
          <label class="block text-sm font-medium mb-2 stat-label">新建分类</label>
          <div class="flex gap-3 mb-3">
            <input type="text" x-model="newCategory.name" @keyup.enter="addCategory()"
                   placeholder="分类名称" maxlength="20" class="input-field flex-1">
            <button @click="addCategory()" :disabled="!newCategory.name.trim() || addingCategory" class="btn-primary shrink-0">
              <span x-show="addingCategory" class="spinner"></span>
              <span x-show="!addingCategory">创建</span>
            </button>
          </div>
          <!-- Color Picker -->
          <div class="flex gap-2 flex-wrap">
            <template x-for="c in categoryColors" :key="c">
              <span class="color-swatch" :class="newCategory.color === c ? 'selected' : ''"
                    :style="'background:' + c" @click="newCategory.color = c"></span>
            </template>
          </div>
        </div>

        <!-- Category List -->
        <div>
          <label class="block text-sm font-medium mb-2 stat-label">已有分类 <span class="text-xs opacity-50">(拖动排序)</span></label>
          <div x-show="categories.length === 0" class="text-sm stat-label py-4 text-center">
            暂无分类，在上方新建
          </div>
          <div @dragend="saveCategoryOrder(); dragCategoryIdx = -1; dragOverIdx = -1;">
            <template x-for="(cat, idx) in categories" :key="cat.id">
              <div class="category-list-item" draggable="true"
                   @dragstart="dragCategoryIdx = idx; event.dataTransfer.effectAllowed = 'move'"
                   @dragover.prevent="dragOverIdx = idx"
                   @drop.prevent="if (dragCategoryIdx >= 0 && dragCategoryIdx !== idx) { const item = categories.splice(dragCategoryIdx, 1)[0]; categories.splice(idx, 0, item); }"
                   @dragleave="dragOverIdx = -1"
                   :class="{'opacity-30': dragCategoryIdx === idx, 'ring-2 ring-indigo-400': dragOverIdx === idx && dragOverIdx !== dragCategoryIdx}"
                   :style="dragOverIdx === idx && dragOverIdx !== dragCategoryIdx ? 'transform: scale(1.02); border-color: #6366f1;' : ''">
                <span style="cursor:grab;font-size:0.9rem;opacity:0.4;user-select:none;">⠿</span>
                <span class="category-color-dot" :style="'background:' + cat.color"></span>
                <input type="text" x-model="cat.editName" 
                       class="input-field flex-1" style="padding:8px 12px;font-size:0.9rem;"
                       @keyup.enter="updateCategory(cat.id, cat.editName, cat.color)">
                <div class="flex gap-1">
                  <button @click="updateCategory(cat.id, cat.editName, cat.color)" 
                          class="btn-secondary text-xs py-1.5 px-3">保存</button>
                  <button @click="deleteCategory(cat.id, cat.name)" 
                          class="btn-danger text-xs py-1.5 px-3">删除</button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Report Modal -->
    <div class="modal-overlay" :class="{ 'active': showAddReportModal }" @click.self="closeAddReportModal()">
      <div class="modal-content">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl sm:text-2xl font-bold gradient-text">添加研报</h2>
          <button @click="closeAddReportModal()" class="text-2xl opacity-40 hover:opacity-70 transition-opacity">✕</button>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-2 stat-label">关联股票</label>
            <input type="text" x-model="newReport.stock_name" placeholder="例如: 贵州茅台" class="input-field">
          </div>
          <div>
            <label class="block text-sm font-medium mb-2 stat-label">内容摘要 *</label>
            <textarea x-model="newReport.summary" rows="4" placeholder="研报核心观点..." class="input-field resize-none"></textarea>
          </div>
        </div>

        <div class="mt-6">
          <button @click="addReport()" :disabled="!newReport.summary.trim()" class="btn-primary w-full justify-center text-lg py-4">
            ✓ 保存研报
          </button>
        </div>
      </div>
    </div>

  </main>

  <script>
    function stockApp() {
      return {
        // ===== State =====
        theme: localStorage.getItem('stock-tracker-theme') || 'dark',
        stocks: [],
        loading: true,
        lastUpdated: '--',
        isRefreshing: false,
        stockListExpanded: localStorage.getItem('stockListExpanded') !== 'false',
        sortBy: localStorage.getItem('sortBy') || 'time',
        sortAsc: localStorage.getItem('sortAsc') === 'true',
        viewMode: localStorage.getItem('viewMode') || 'table',

        // Categories
        categories: [],
        showCategoryModal: false,
        newCategory: { name: '', color: '#6366f1' },
        addingCategory: false,
        categoryColors: ['#6366f1', '#8b5cf6', '#ec4899', '#ef4444', '#f59e0b', '#22c55e', '#14b8a6', '#06b6d4', '#3b82f6'],
        categoryExpanded: {},
        categoryPickerFor: null,
        newStockCategoryId: '',
        dragCategoryIdx: -1,
        dragOverIdx: -1,

        stockTags: [
          { value: '关注', label: '🔥 重点关注' },
          { value: '持仓', label: '💎 持仓中' },
          { value: '观察', label: '👀 观察中' },
          { value: '卖出', label: '⚠️ 考虑卖出' },
          { value: '止盈', label: '✅ 已止盈' },
          { value: '止损', label: '🛑 已止损' },
          { value: '清仓', label: '⚪ 已清仓' },
        ],

        // Edit Modal
        showEditModal: false,
        editingStock: null,
        editForm: { name: '', reason: '', notes: '', category_id: null },
        savingEdit: false,

        // Tunnel
        tunnelUrl: null,
        tunnelStarting: false,

        // Add Modal
        showAddModal: false,
        newStock: { query: '', code: '', reason: '' },
        searchedStock: null,
        searchResults: [],
        selectedSearchIdx: 0,
        searchingStock: false,
        addingStock: false,
        joinDate: new Date().toISOString().split('T')[0],
        joinPrice: 0,
        todayStr: new Date().toISOString().split('T')[0],

        // Research Reports
        researchExpanded: localStorage.getItem('researchExpanded') !== 'false',
        reports: [],
        showAddReportModal: false,
        newReport: { title: '', stock_name: '', summary: '' },

        // Toast
        toastVisible: false,
        toastMessage: '',
        toastType: 'success',
        toastTimer: null,

        // Auto refresh
        refreshTimer: null,

        // Mobile
        mobileMenuOpen: false,

        // Stock Detail
        detailStock: null,

        // ===== Init =====
        init() {
          this.loadStocks();
          this.loadCategories();
          this.loadReports();
          document.body.className = 'theme-' + this.theme;
          
          // Init category expanded state
          const saved = localStorage.getItem('categoryExpanded');
          if (saved) {
            try { this.categoryExpanded = JSON.parse(saved); } catch(e) {}
          }

          this.refreshTimer = setInterval(() => {
            this.refreshPricesSilent();
          }, 30000);
        },

        // ===== Categories =====

        get categoriesWithStocks() {
          // Group stocks by category
          const catMap = {};
          
          // Add uncategorized group first
          catMap['__uncategorized'] = {
            id: '__uncategorized',
            name: '未分类',
            color: '#888',
            stocks: [],
          };

          this.categories.forEach(cat => {
            catMap[cat.id] = { ...cat, stocks: [] };
          });

          // Add a copy of categories
          const cats = [...this.categories];

          this.sortedStocks.forEach(stock => {
            if (stock.category_id && catMap[stock.category_id]) {
              catMap[stock.category_id].stocks.push(stock);
            } else {
              catMap['__uncategorized'].stocks.push(stock);
            }
          });

          const result = [];
          if (catMap['__uncategorized'].stocks.length > 0) {
            result.push(catMap['__uncategorized']);
          }
          cats.forEach(cat => {
            if (catMap[cat.id] && catMap[cat.id].stocks.length > 0) {
              result.push(catMap[cat.id]);
            }
          });
          // Also include empty categories if user wants to see them
          cats.forEach(cat => {
            if (!result.find(r => r.id === cat.id)) {
              result.push({ ...cat, stocks: [] });
            }
          });

          return result;
        },

        isCategoryExpanded(id) {
          // Default: collapsed for uncategorized, expanded for named categories
          if (this.categoryExpanded[id] === undefined) {
            return id !== '__uncategorized';
          }
          return this.categoryExpanded[id];
        },

        toggleCategoryExpanded(id) {
          this.categoryExpanded[id] = !this.isCategoryExpanded(id);
          localStorage.setItem('categoryExpanded', JSON.stringify(this.categoryExpanded));
        },

        getCategoryName(categoryId) {
          if (!categoryId) return '';
          const cat = this.categories.find(c => c.id === categoryId);
          return cat ? cat.name : '';
        },

        getCategoryColor(categoryId) {
          if (!categoryId) return '#888';
          const cat = this.categories.find(c => c.id === categoryId);
          return cat ? cat.color : '#888';
        },

        async loadCategories() {
          try {
            const res = await fetch('/api/categories');
            const json = await res.json();
            if (json.success) {
              this.categories = json.data.categories;
              // Merge uncategorized stocks into main stocks array
              if (json.data.uncategorized && json.data.uncategorized.length > 0) {
                const trackedIds = this.stocks.map(s => s.id);
                json.data.uncategorized.forEach(s => {
                  if (!trackedIds.includes(s.id)) {
                    // Will be added by loadStocks anyway
                  }
                });
              }
            }
          } catch (e) {
            console.error('Load categories error:', e);
          }
        },

        openCategoryModal() {
          this.showCategoryModal = true;
          this.newCategory = { name: '', color: '#6366f1' };
          // Initialize edit names
          this.categories.forEach(cat => {
            cat.editName = cat.name;
          });
          document.body.style.overflow = 'hidden';
        },

        closeCategoryModal() {
          this.showCategoryModal = false;
          document.body.style.overflow = '';
        },

        async addCategory() {
          const name = this.newCategory.name.trim();
          if (!name) return;
          this.addingCategory = true;
          try {
            const res = await fetch('/api/categories', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name, color: this.newCategory.color }),
            });
            const json = await res.json();
            if (json.success) {
              this.showToast(json.message, 'success');
              await this.loadCategories();
              this.newCategory = { name: '', color: '#6366f1' };
            } else {
              this.showToast(json.error, 'error');
            }
          } catch (e) {
            this.showToast('创建失败', 'error');
          } finally {
            this.addingCategory = false;
          }
        },

        async updateCategory(id, name, color) {
          if (!name.trim()) return;
          try {
            const res = await fetch(`/api/categories/${id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: name.trim(), color }),
            });
            const json = await res.json();
            if (json.success) {
              this.showToast('分类已更新', 'success');
              await this.loadCategories();
              // Update editName
              const cat = this.categories.find(c => c.id === id);
              if (cat) cat.editName = cat.name;
            } else {
              this.showToast(json.error, 'error');
            }
          } catch (e) {
            this.showToast('更新失败', 'error');
          }
        },

        async deleteCategory(id, name) {
          if (!confirm(`确定删除分类 "${name}"？该分类下的股票将移到"未分类"。`)) return;
          try {
            const res = await fetch(`/api/categories/${id}`, { method: 'DELETE' });
            const json = await res.json();
            if (json.success) {
              this.showToast(json.message, 'success');
              await this.loadCategories();
              await this.loadStocks();
            } else {
              this.showToast(json.error, 'error');
            }
          } catch (e) {
            this.showToast('删除失败', 'error');
          }
        },

        async saveCategoryOrder() {
          // Reset drag state
          this.dragCategoryIdx = -1;
          this.dragOverIdx = -1;
          
          // Build order array from current categories order
          const order = this.categories.map((cat, idx) => ({ id: cat.id, sort_order: idx }));
          try {
            const res = await fetch('/api/categories/reorder', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ order }),
            });
            const json = await res.json();
            if (json.success) {
              // Reload categories to get updated order
              await this.loadCategories();
            }
          } catch (e) {
            console.error('Reorder error:', e);
          }
        },

        openCategoryPicker(stockId) {
          this.categoryPickerFor = this.categoryPickerFor === stockId ? null : stockId;
        },

        async moveStockToCategory(stockId, categoryId) {
          try {
            const res = await fetch(`/api/stocks/${stockId}/category`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ category_id: categoryId }),
            });
            const json = await res.json();
            if (json.success) {
              await this.loadStocks();
              this.showToast('分类已更新', 'success');
            } else {
              this.showToast(json.error, 'error');
            }
          } catch (e) {
            this.showToast('更新分类失败', 'error');
          }
        },

        // ===== Edit Stock =====

        openEditModal(stock) {
          this.showEditModal = true;
          this.editingStock = { ...stock };
          // Derive alert_mode from alert_type + alert_direction
          const at = (stock.alert_type || 'percent');
          const ad = (stock.alert_direction || 'down');
          this.editForm = {
            name: stock.name || '',
            reason: stock.reason || '',
            notes: stock.notes || '',
            tag: stock.tag || '',
            alert_threshold: stock.alert_threshold,
            alert_mode: at + '-' + ad,
            category_id: stock.category_id || null,
          };
          document.body.style.overflow = 'hidden';
        },

        closeEditModal() {
          this.showEditModal = false;
          this.editingStock = null;
          document.body.style.overflow = '';
        },

        async saveEdit() {
          if (!this.editingStock) return;
          this.savingEdit = true;
          try {
            // Update stock info
            const res = await fetch(`/api/stocks/${this.editingStock.id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                name: this.editForm.name.trim(),
                reason: this.editForm.reason.trim(),
                notes: this.editForm.notes.trim(),
                tag: this.editForm.tag,
                alert_threshold: this.editForm.alert_threshold,
                // Derive alert_type and alert_direction from alert_mode
                alert_type: this.editForm.alert_mode?.split('-')[0] || 'percent',
                alert_direction: this.editForm.alert_mode?.split('-')[1] || 'down',
              }),
            });
            const json = await res.json();
            if (json.success) {
              // Update category if changed
              if (this.editForm.category_id !== this.editingStock.category_id) {
                await this.moveStockToCategory(this.editingStock.id, this.editForm.category_id);
              }
              this.showToast('股票信息已更新', 'success');
              this.closeEditModal();
              await this.loadStocks();
            } else {
              this.showToast(json.error || '编辑失败', 'error');
            }
          } catch (e) {
            this.showToast('网络错误', 'error');
          } finally {
            this.savingEdit = false;
          }
        },

        async resetAlert(stockId) {
          try {
            const res = await fetch(`/api/stocks/${stockId}/alert-reset`, { method: 'POST' });
            const json = await res.json();
            if (json.success) {
              this.showToast('预警已复位', 'success');
              await this.loadStocks();
              if (this.editingStock) this.editingStock.alert_triggered = 0;
            }
          } catch (e) {
            this.showToast('复位失败', 'error');
          }
        },

        // ===== Sort =====

        get sortedStocks() {
          // Triggered alerts always on top
          const s = [...this.stocks];
          s.sort((a, b) => {
            // Alert triggered stocks go first
            if ((a.alert_triggered || 0) !== (b.alert_triggered || 0)) {
              return (b.alert_triggered || 0) - (a.alert_triggered || 0);
            }
            // Then sort by selected field
            if (this.sortBy === 'time') {
              const diff = (a.created_at || '') < (b.created_at || '') ? 1 : -1;
              return this.sortAsc ? -diff : diff;
            } else if (this.sortBy === 'return') {
              const diff = (b.change_percent || 0) - (a.change_percent || 0);
              return this.sortAsc ? -diff : diff;
            } else if (this.sortBy === 'daily') {
              const diff = (b.daily_change || 0) - (a.daily_change || 0);
              return this.sortAsc ? -diff : diff;
            }
            return 0;
          });
          return s;
        },

        get stocksWithNotes() {
          return this.stocks.filter(s => s.notes && s.notes.trim().length > 0).map(s => ({
            ...s,
            notes_sub: s.notes.length > 30 ? s.notes.substring(0, 30) + '...' : s.notes,
          }));
        },

        toggleSort(field) {
          if (this.sortBy === field) {
            this.sortAsc = !this.sortAsc;
          } else {
            this.sortBy = field;
            this.sortAsc = false; // Default: newest/highest first
          }
          localStorage.setItem('sortBy', this.sortBy);
          localStorage.setItem('sortAsc', this.sortAsc);
        },

        // ===== Summary Stats =====

        get totalReturn() {
          if (this.stocks.length === 0) return 0;
          const total = this.stocks.reduce((sum, s) => sum + (s.change_percent || 0), 0);
          return total / this.stocks.length;
        },

        get winCount() {
          return this.stocks.filter(s => (s.change_percent || 0) > 0).length;
        },

        get loseCount() {
          return this.stocks.filter(s => (s.change_percent || 0) < 0).length;
        },

        get bestStock() {
          if (this.stocks.length === 0) return null;
          return this.stocks.reduce((best, s) => 
            (s.change_percent || 0) > (best.change_percent || 0) ? s : best
          );
        },

        get worstStock() {
          if (this.stocks.length === 0) return null;
          return this.stocks.reduce((worst, s) => 
            (s.change_percent || 0) < (worst.change_percent || 0) ? s : worst
          );
        },

        // ===== View Mode =====

        setViewMode(mode) {
          this.viewMode = mode;
          localStorage.setItem('viewMode', mode);
        },

        // ===== Stock Operations =====

        async loadStocks() {
          this.loading = true;
          try {
            const res = await fetch('/api/stocks');
            const json = await res.json();
            if (json.success) {
              this.stocks = json.data;
              this.lastUpdated = new Date().toLocaleTimeString();
            }
          } catch (e) {
            console.error('Failed to load stocks:', e);
          } finally {
            this.loading = false;
          }
        },

        // ===== Import / Export =====

        async exportData() {
          try {
            const res = await fetch('/api/export');
            const json = await res.json();
            if (json.success) {
              const blob = new Blob([JSON.stringify(json.data, null, 2)], { type: 'application/json' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `stock-tracker-backup-${new Date().toISOString().split('T')[0]}.json`;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
              this.showToast(`导出成功: ${json.data.stocks.length} 只股票`, 'success');
            } else {
              this.showToast('导出失败', 'error');
            }
          } catch (e) {
            this.showToast('导出失败: ' + e.message, 'error');
          }
        },

        async importData(event) {
          const file = event.target.files[0];
          if (!file) return;
          
          if (!confirm('⚠️ 导入将覆盖所有现有数据！\n\n当前的所有股票、分类、研报、价格记录都将被替换为导入文件中的数据。\n确定继续吗？')) {
            event.target.value = '';
            return;
          }

          try {
            const text = await file.text();
            const data = JSON.parse(text);
            
            const res = await fetch('/api/import', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ data }),
            });
            const json = await res.json();
            if (json.success) {
              this.showToast(json.message, 'success');
              await this.loadStocks();
              await this.loadCategories();
              await this.loadReports();
            } else {
              this.showToast(json.error || '导入失败', 'error');
            }
          } catch (e) {
            this.showToast('导入失败: ' + e.message, 'error');
          } finally {
            event.target.value = '';
          }
        },

        async refreshAll() {
          this.isRefreshing = true;
          try {
            const res = await fetch('/api/stocks/refresh', { method: 'POST' });
            const json = await res.json();
            if (json.success) {
              await this.loadStocks();
              this.showToast(json.message, 'success');
            } else {
              this.showToast(json.error || '更新失败', 'error');
            }
          } catch (e) {
            this.showToast('网络错误，请稍后重试', 'error');
          } finally {
            this.isRefreshing = false;
          }
        },

        async refreshPricesSilent() {
          try {
            await fetch('/api/stocks/refresh', { method: 'POST' });
            const res = await fetch('/api/stocks');
            const json = await res.json();
            if (json.success) {
              this.stocks = json.data;
              this.lastUpdated = new Date().toLocaleTimeString();
            }
          } catch (e) {}
        },

        // ===== Stock Detail =====

        openDetail(stock) {
          this.detailStock = stock;
          document.body.style.overflow = 'hidden';
        },

        closeDetail() {
          this.detailStock = null;
          document.body.style.overflow = '';
        },

        // ===== Search & Add =====

        openAddModal() {
          this.showAddModal = true;
          this.newStock = { query: '', code: '', reason: '' };
          this.searchedStock = null;
          this.searchResults = [];
          this.joinDate = new Date().toISOString().split('T')[0];
          this.joinPrice = 0;
          this.newStockCategoryId = '';
          document.body.style.overflow = 'hidden';
        },

        closeAddModal() {
          this.showAddModal = false;
          document.body.style.overflow = '';
        },

        selectSearchResult(item) {
          this.newStock.code = item.code;
          this.newStock.query = item.name + ' (' + item.code + ')';
          this.searchResults = [];
          this.searchedStock = {
            ...item,
            alreadyTracked: item.alreadyTracked,
            price: 0,
          };
          this.recalcJoinPrice();
        },

        async recalcJoinPrice() {
          if (!this.searchedStock || !this.searchedStock.code || !this.joinDate) return;
          const code = this.searchedStock.code;
          const market = this.searchedStock.market;
          const isToday = this.joinDate === this.todayStr;
          try {
            if (isToday) {
              const res = await fetch('/api/stocks/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code }),
              });
              const json = await res.json();
              if (json.success && json.data.price) {
                this.joinPrice = json.data.price;
                this.searchedStock.price = json.data.price;
                this.searchedStock.name = json.data.name || this.searchedStock.name;
                this.searchedStock.market = json.data.market || this.searchedStock.market;
              }
            } else {
              const res = await fetch('/api/stocks/historical-price', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code, market, date: this.joinDate }),
              });
              const json = await res.json();
              if (json.success && json.data) {
                this.joinPrice = json.data.close;
                this.searchedStock.price = json.data.close;
              } else {
                this.showToast(json.error || '该日无交易数据', 'error');
              }
            }
          } catch (e) {}
        },

        async searchStock() {
          const query = this.newStock.query.trim();
          if (!query) return;
          this.searchingStock = true;
          this.searchResults = [];
          this.selectedSearchIdx = 0;
          try {
            const res = await fetch('/api/stocks/search', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ code: query }),
            });
            const json = await res.json();
            if (json.success) {
              if (json.data.searchResults && json.data.searchResults.length >= 1) {
                this.searchResults = json.data.searchResults;
                this.searchedStock = null;
              } else {
                this.searchResults = [];
                this.searchedStock = json.data;
                if (json.data.code) {
                  this.newStock.code = json.data.code;
                  this.recalcJoinPrice();
                }
              }
            } else {
              this.searchedStock = { error: json.error || '查询失败' };
            }
          } catch (e) {
            this.searchedStock = { error: '网络错误，请稍后重试' };
          } finally {
            this.searchingStock = false;
          }
        },

        async addStock() {
          if (!this.searchedStock || !this.searchedStock.name || this.searchedStock.alreadyTracked) return;
          const code = this.newStock.code || this.searchedStock.code;
          if (!code) {
            this.showToast('请先搜索并选择股票', 'error');
            return;
          }
          this.addingStock = true;
          try {
            const res = await fetch('/api/stocks/add', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                code: code,
                name: this.searchedStock.name,
                reason: this.newStock.reason.trim(),
                joinDate: this.joinDate,
                category_id: this.newStockCategoryId || null,
              }),
            });
            const json = await res.json();
            if (json.success) {
              this.showToast(json.message, 'success');
              this.closeAddModal();
              await this.loadStocks();
            } else {
              this.showToast(json.error || '添加失败', 'error');
            }
          } catch (e) {
            this.showToast('网络错误，请稍后重试', 'error');
          } finally {
            this.addingStock = false;
          }
        },

        // ===== Remove =====

        async removeStock(id, name) {
          if (!confirm(`确定要移除 "${name}" ？`)) return;
          try {
            const res = await fetch(`/api/stocks/${id}`, { method: 'DELETE' });
            const json = await res.json();
            if (json.success) {
              this.showToast(json.message, 'success');
              await this.loadStocks();
            } else {
              this.showToast(json.error || '移除失败', 'error');
            }
          } catch (e) {
            this.showToast('网络错误，请稍后重试', 'error');
          }
        },

        // ===== Tunnel =====

        async toggleTunnel() {
          if (this.tunnelUrl) {
            try {
              await navigator.clipboard.writeText(this.tunnelUrl);
              this.showToast('已复制分享链接: ' + this.tunnelUrl, 'success');
            } catch {
              this.showToast('对外地址: ' + this.tunnelUrl, 'success');
            }
            return;
          }
          this.tunnelStarting = true;
          try {
            const res = await fetch('/api/tunnel/start', { method: 'POST' });
            const json = await res.json();
            if (json.success && json.url) {
              this.tunnelUrl = json.url;
              try {
                await navigator.clipboard.writeText(json.url);
                this.showToast('🎉 对外地址已生成并复制到剪贴板!', 'success');
              } catch {
                this.showToast('🎉 对外地址: ' + json.url, 'success');
              }
            } else {
              this.showToast(json.error || '启动对外访问失败', 'error');
            }
          } catch (e) {
            this.showToast('启动对外访问失败，请检查网络', 'error');
          } finally {
            this.tunnelStarting = false;
          }
        },

        // ===== Research Reports =====

        async loadReports() {
          try {
            const res = await fetch('/api/research');
            const json = await res.json();
            if (json.success) this.reports = json.data;
          } catch (e) {}
        },

        openAddReportModal() {
          this.showAddReportModal = true;
          this.newReport = { title: '', stock_name: '', summary: '' };
          document.body.style.overflow = 'hidden';
        },

        closeAddReportModal() {
          this.showAddReportModal = false;
          document.body.style.overflow = '';
        },

        async addReport() {
          if (!this.newReport.summary.trim()) return;
          try {
            const res = await fetch('/api/research', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.newReport),
            });
            const json = await res.json();
            if (json.success) {
              this.showToast(json.message, 'success');
              this.closeAddReportModal();
              this.loadReports();
            } else {
              this.showToast(json.error || '添加失败', 'error');
            }
          } catch (e) {
            this.showToast('网络错误', 'error');
          }
        },

        async deleteReport(id) {
          if (!confirm('确定删除这篇研报？')) return;
          try {
            const res = await fetch(`/api/research/${id}`, { method: 'DELETE' });
            const json = await res.json();
            if (json.success) {
              this.showToast(json.message, 'success');
              this.loadReports();
            }
          } catch (e) {
            this.showToast('删除失败', 'error');
          }
        },

        // ===== Theme =====

        toggleTheme() {
          this.theme = this.theme === 'dark' ? 'light' : 'dark';
          document.body.className = 'theme-' + this.theme;
          localStorage.setItem('stock-tracker-theme', this.theme);
        },

        // ===== Toast =====

        showToast(message, type = 'success') {
          this.toastMessage = message;
          this.toastType = type;
          this.toastVisible = true;
          if (this.toastTimer) clearTimeout(this.toastTimer);
          this.toastTimer = setTimeout(() => {
            this.toastVisible = false;
          }, 3000);
        },

        // ===== Formatters =====

        formatPrice(price) {
          if (price == null) return '--';
          return '¥' + parseFloat(price).toFixed(2);
        },

        formatPercent(percent) {
          if (percent == null) return '--';
          const val = parseFloat(percent);
          const sign = val >= 0 ? '+' : '';
          return `${sign}${val.toFixed(2)}%`;
        },
      };
    }
  </script>
</body>
</html>
