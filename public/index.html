<!DOCTYPE html>
<html lang="zh-CN" x-data="stockApp()" x-init="init()">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>股票追踪助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ===== Premium Design System ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background 0.5s ease, color 0.5s ease;
      overflow-x: hidden;
    }

    /* Light Theme */
    .theme-light body, body.theme-light {
      background: #f0f2f5;
      color: #1a1a2e;
    }
    .theme-light .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
    }
    .theme-light .glass-nav {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(30px) saturate(200%);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }
    .theme-light .glass-nav-mobile {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(30px) saturate(200%);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }
    .theme-light .gradient-text {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .theme-light .stat-label { color: #64748b; }
    .theme-light .input-field {
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(0,0,0,0.08);
      color: #1a1a2e;
    }
    .theme-light .modal-overlay {
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
    }
    .theme-light .reason-text { color: #475569; }
    .theme-light .notes-text { color: #6b7280; }
    .theme-light .empty-icon { color: #cbd5e1; }
    .theme-light .empty-text { color: #94a3b8; }
    .theme-light .table-header { background: rgba(255,255,255,0.5); color: #64748b; }
    .theme-light .table-row { border-bottom: 1px solid rgba(0,0,0,0.04); }
    .theme-light .table-row:hover { background: rgba(99,102,241,0.03); }
    .theme-light .mobile-menu-panel { background: rgba(255,255,255,0.98); }
    .theme-light .sidebar-overlay { background: rgba(0,0,0,0.3); }
    .theme-light .category-tag { background: rgba(99,102,241,0.1); }
    .theme-light .compact-stock-name { color: #1a1a2e; }

    /* Dark Theme */
    .theme-dark body, body.theme-dark {
      background: #0f0f1a;
      color: #e2e8f0;
    }
    .theme-dark .glass-card {
      background: rgba(30, 30, 55, 0.6);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .theme-dark .glass-nav {
      background: rgba(15, 15, 26, 0.85);
      backdrop-filter: blur(30px) saturate(200%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .theme-dark .glass-nav-mobile {
      background: rgba(15, 15, 26, 0.95);
      backdrop-filter: blur(30px) saturate(200%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .theme-dark .gradient-text {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .theme-dark .stat-label { color: #94a3b8; }
    .theme-dark .input-field {
      background: rgba(30,30,55,0.8);
      border: 1px solid rgba(255,255,255,0.08);
      color: #e2e8f0;
    }
    .theme-dark .modal-overlay {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
    }
    .theme-dark .reason-text { color: #94a3b8; }
    .theme-dark .notes-text { color: #7c8ba8; }
    .theme-dark .empty-icon { color: #334155; }
    .theme-dark .empty-text { color: #64748b; }
    .theme-dark .table-header { background: rgba(30,30,55,0.5); color: #94a3b8; }
    .theme-dark .table-row { border-bottom: 1px solid rgba(255,255,255,0.04); }
    .theme-dark .table-row:hover { background: rgba(99,102,241,0.05); }
    .theme-dark .mobile-menu-panel { background: rgba(15,15,26,0.98); }
    .theme-dark .sidebar-overlay { background: rgba(0,0,0,0.6); }
    .theme-dark .category-tag { background: rgba(99,102,241,0.2); }
    .theme-dark .compact-stock-name { color: #e2e8f0; }

    /* Shared Styles */
    .glass-card {
      border-radius: 20px;
      padding: 24px;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .glass-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .theme-light .glass-card::before {
      background: linear-gradient(135deg, rgba(99,102,241,0.05), rgba(139,92,246,0.05));
    }
    .theme-dark .glass-card::before {
      background: linear-gradient(135deg, rgba(99,102,241,0.08), rgba(139,92,246,0.08));
    }
    .glass-card:hover::before { opacity: 1; }
    .glass-card:hover {
      transform: translateY(-4px) scale(1.01);
    }

    .glass-nav {
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .gradient-text { background-clip: text; }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.35);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn-secondary {
      background: rgba(99, 102, 241, 0.1);
      color: #6366f1;
      border: 1px solid rgba(99, 102, 241, 0.2);
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-secondary:hover {
      background: rgba(99, 102, 241, 0.15);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.85rem;
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1.1rem;
      border: none;
      background: transparent;
      flex-shrink: 0;
    }
    .theme-light .btn-icon { color: #64748b; }
    .theme-light .btn-icon:hover { background: rgba(0,0,0,0.05); }
    .theme-dark .btn-icon { color: #94a3b8; }
    .theme-dark .btn-icon:hover { background: rgba(255,255,255,0.05); }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    .input-field:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    .input-field::placeholder { color: #94a3b8; }

    /* Price Colors (A股 convention: red up, green down) */
    .price-up { color: #dc2626; }
    .price-down { color: #16a34a; }
    .price-bg-up { background: rgba(220, 38, 38, 0.1); }
    .price-bg-down { background: rgba(22, 163, 74, 0.1); }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    .modal-content {
      width: 90%;
      max-width: 540px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 24px;
      padding: 32px;
      transform: scale(0.9) translateY(20px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-overlay.active .modal-content {
      transform: scale(1) translateY(0);
    }
    .theme-light .modal-content {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(40px);
      box-shadow: 0 25px 60px rgba(0,0,0,0.15);
    }
    .theme-dark .modal-content {
      background: rgba(25, 25, 50, 0.95);
      backdrop-filter: blur(40px);
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }

    /* Stock card number animation */
    @keyframes numberPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .number-pop {
      animation: numberPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Stock card enter animation */
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .card-enter {
      animation: cardEnter 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .theme-light ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .theme-dark ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    /* Spin animation */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      top: 80px;
      right: 20px;
      z-index: 200;
      padding: 16px 24px;
      border-radius: 14px;
      font-weight: 500;
      transform: translateX(120%);
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      max-width: 400px;
    }
    .toast.show { transform: translateX(0); }
    .toast-success { background: #059669; color: white; }
    .toast-error { background: #dc2626; color: white; }

    /* Loading shimmer */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, transparent 0%, rgba(99,102,241,0.05) 50%, transparent 100%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }

    /* Stock grid */
    .stocks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }
    .stocks-grid.compact {
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    @media (max-width: 768px) {
      .stocks-grid { grid-template-columns: 1fr; }
      .stocks-grid.compact { grid-template-columns: 1fr; gap: 12px; }
    }

    /* Market tag */
    .market-tag {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .market-sh { background: rgba(99, 102, 241, 0.15); color: #6366f1; }
    .market-sz { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
    .market-bj { background: rgba(234, 179, 8, 0.15); color: #eab308; }

    /* Stock Tag/Label */
    .stock-tag {
      display: inline-flex;
      align-items: center;
      padding: 1px 8px;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      white-space: nowrap;
      line-height: 1.6;
      flex-shrink: 0;
    }
    .stock-tag.关注 { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    .stock-tag.持仓 { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
    .stock-tag.观察 { background: rgba(234, 179, 8, 0.15); color: #eab308; }
    .stock-tag.卖出 { background: rgba(249, 115, 22, 0.15); color: #f97316; }
    .stock-tag.清仓 { background: rgba(148, 163, 184, 0.2); color: #94a3b8; }
    .stock-tag.止盈 { background: rgba(236, 72, 153, 0.15); color: #ec4899; }
    .stock-tag.止损 { background: rgba(100, 116, 139, 0.2); color: #64748b; }

    /* Alert blinking animation */
    @keyframes alertBlink {
      0%, 100% { box-shadow: 0 0 8px rgba(239, 68, 68, 0.3); }
      50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.8), 0 0 40px rgba(239, 68, 68, 0.3); }
    }
    .alert-triggered {
      animation: alertBlink 1.5s ease-in-out infinite;
    }
    .alert-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 600;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      animation: alertBlink 1.5s ease-in-out infinite;
    }
    .ticker-item.alert-triggered {
      background: rgba(239, 68, 68, 0.1);
      border-radius: 8px;
    }

    /* Glass card deco line */
    .glass-card .deco-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      border-radius: 20px 20px 0 0;
      background: linear-gradient(90deg, #6366f1, #8b5cf6, #a78bfa);
      opacity: 0.4;
    }

    /* Theme toggle button */
    .theme-toggle-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1.2rem;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.15);
      flex-shrink: 0;
    }
    .theme-toggle-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      transform: translateY(-2px);
    }

    /* Category section */
    .category-section {
      margin-bottom: 24px;
    }
    .category-header {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 10px 0;
      user-select: none;
    }
    .category-color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .category-name {
      font-size: 1.15rem;
      font-weight: 600;
    }
    .category-stock-count {
      font-size: 0.8rem;
      padding: 2px 10px;
      border-radius: 12px;
      background: rgba(99,102,241,0.1);
    }
    .category-expand-icon {
      margin-left: auto;
      transition: transform 0.3s ease;
      font-size: 0.8rem;
      opacity: 0.5;
    }
    .category-expand-icon.expanded {
      transform: rotate(180deg);
    }

    /* Compact card mode */
    .compact-card {
      border-radius: 14px !important;
      padding: 14px 16px !important;
    }
    .compact-card .deco-line { display: none; }
    .compact-card:hover {
      transform: translateY(-2px) scale(1.005) !important;
    }
    .compact-card .stock-name {
      font-size: 0.9rem !important;
    }
    .compact-card .stock-price {
      font-size: 1.15rem !important;
    }
    .compact-card .stats-row {
      display: flex;
      gap: 16px;
      flex-wrap: nowrap;
      overflow-x: auto;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(128,128,128,0.1);
    }
    .compact-card .stat-item {
      display: flex;
      flex-direction: column;
      gap: 1px;
      flex-shrink: 0;
    }
    .compact-card .stat-label-text {
      font-size: 0.65rem;
    }
    .compact-card .stat-value {
      font-size: 0.8rem;
      font-weight: 600;
    }
    .compact-card .reason-text {
      font-size: 0.75rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .compact-card .card-actions {
      gap: 4px;
    }
    .compact-card .card-actions button {
      width: 32px;
      height: 32px;
      font-size: 0.85rem;
      padding: 0;
    }
    .compact-card .card-actions .btn-danger {
      padding: 4px 8px;
      font-size: 0.7rem;
    }

    /* Table view */
    .table-view {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .table-view th {
      padding: 12px 16px;
      text-align: left;
      font-weight: 500;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .table-view th:hover {
      opacity: 0.8;
    }
    .table-view td {
      padding: 12px 12px;
      vertical-align: middle;
    }
    .table-view th {
      padding: 12px 12px;
    }
    .td-reason-col {
      max-width: 180px;
    }
    .td-reason-col .truncate {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .table-view .td-name {
      max-width: 200px;
    }
    .table-view .td-name .stock-name {
      font-weight: 600;
      font-size: 0.9rem;
    }
    .table-view .td-name .stock-code {
      font-size: 0.75rem;
      opacity: 0.6;
      display: block;
    }
    .table-view .td-price {
      font-weight: 600;
      white-space: nowrap;
    }
    .table-view .td-change {
      white-space: nowrap;
    }
    .table-view .td-since {
      white-space: nowrap;
    }
    .table-view .td-notes {
      white-space: nowrap;
    }
    .table-view .td-notes .notes-content {
      max-width: 180px;
    }

    /* Category picker */
    .category-picker {
      position: absolute;
      top: 100%;
      right: 0;
      z-index: 60;
      min-width: 200px;
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      max-height: 250px;
      overflow-y: auto;
    }
    .theme-light .category-picker { background: white; }
    .theme-dark .category-picker { background: #1e1e37; }

    .category-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .category-option:hover {
      background: rgba(99,102,241,0.1);
    }
    .category-option.active {
      background: rgba(99,102,241,0.15);
    }

    /* ===== Scrolling Ticker ===== */
    .ticker-container {
      overflow: hidden;
      position: relative;
      border-radius: 12px;
      padding: 10px 0;
      margin-bottom: 16px;
      width: 100%;
    }
    .theme-light .ticker-container { background: rgba(255,255,255,0.4); }
    .theme-dark .ticker-container { background: rgba(30,30,55,0.3); }
    .ticker-track {
      display: flex;
      gap: 32px;
      animation: tickerScroll 30s linear infinite;
      width: max-content;
    }
    .ticker-track:hover {
      animation-play-state: paused;
    }
    @keyframes tickerScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .ticker-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ticker-item:hover {
      background: rgba(99,102,241,0.1);
    }
    .ticker-name {
      font-weight: 600;
      font-size: 0.85rem;
    }
    .ticker-price {
      font-weight: 500;
      font-size: 0.85rem;
    }
    .ticker-change {
      font-weight: 600;
      font-size: 0.8rem;
      padding: 1px 6px;
      border-radius: 4px;
    }
    .ticker-change.up { background: rgba(220,38,38,0.1); color: #dc2626; }
    .ticker-change.down { background: rgba(22,163,74,0.1); color: #16a34a; }
    .ticker-sep {
      width: 1px;
      height: 16px;
      background: rgba(128,128,128,0.2);
      flex-shrink: 0;
    }

    /* Stock Detail Sheet */
    .detail-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .detail-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    .theme-light .detail-overlay { background: rgba(0,0,0,0.3); }
    .theme-dark .detail-overlay { background: rgba(0,0,0,0.6); }

    .detail-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 101;
      max-height: 70vh;
      border-radius: 20px 20px 0 0;
      padding: 24px 24px 32px;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
    }
    .detail-sheet.active {
      transform: translateY(0);
    }
    .theme-light .detail-sheet { background: rgba(255,255,255,0.98); }
    .theme-dark .detail-sheet { background: rgba(20,20,40,0.98); backdrop-filter: blur(30px); }
    .detail-sheet .handle {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      margin: 0 auto 16px;
    }
    .theme-light .detail-sheet .handle { background: #d1d5db; }
    .theme-dark .detail-sheet .handle { background: #4b5563; }

    /* Summary stats bar */
    .summary-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .summary-item {
      padding: 10px 16px;
      border-radius: 12px;
      flex: 1;
      min-width: 100px;
      text-align: center;
    }
    .theme-light .summary-item { background: rgba(255,255,255,0.5); }
    .theme-dark .summary-item { background: rgba(30,30,55,0.4); }
    .summary-item .value {
      font-size: 1.2rem;
      font-weight: 700;
    }
    .summary-item .label {
      font-size: 0.7rem;
      margin-top: 2px;
      opacity: 0.6;
    }

    /* Color swatches */
    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
      display: inline-block;
    }
    .color-swatch:hover, .color-swatch.selected {
      transform: scale(1.15);
      border-color: #6366f1;
    }

    /* Mobile menu */
    .mobile-menu-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .mobile-menu-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    .mobile-menu-panel {
      position: fixed;
      top: 0; right: 0;
      width: 280px;
      height: 100vh;
      z-index: 91;
      padding: 24px 20px;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
    }
    .mobile-menu-panel.active {
      transform: translateX(0);
    }
    .mobile-menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background 0.2s;
      width: 100%;
      border: none;
      background: transparent;
    }
    .theme-light .mobile-menu-item { color: #1a1a2e; }
    .theme-light .mobile-menu-item:hover { background: rgba(0,0,0,0.04); }
    .theme-dark .mobile-menu-item { color: #e2e8f0; }
    .theme-dark .mobile-menu-item:hover { background: rgba(255,255,255,0.04); }

    /* View mode toggle */
    .view-toggle {
      display: flex;
      gap: 2px;
      background: rgba(128,128,128,0.08);
      border-radius: 8px;
      padding: 2px;
    }
    .view-toggle-btn {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .view-toggle-btn.active {
      background: rgba(99,102,241,0.2);
      color: #6366f1;
    }
    .theme-light .view-toggle-btn { color: #64748b; }
    .theme-dark .view-toggle-btn { color: #94a3b8; }
    .view-toggle-btn:hover:not(.active) { opacity: 0.7; }

    /* Progress bar for max drawdown */
    .progress-bar {
      height: 4px;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
    }
    .theme-light .progress-bar { background: rgba(0,0,0,0.06); }
    .theme-dark .progress-bar { background: rgba(255,255,255,0.06); }
    .progress-bar .fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.6s ease;
    }
    .progress-bar .fill.good { background: linear-gradient(90deg, #22c55e, #16a34a); }
    .progress-bar .fill.warn { background: linear-gradient(90deg, #eab308, #f59e0b); }
    .progress-bar .fill.bad { background: linear-gradient(90deg, #ef4444, #dc2626); }

    /* ===== Mobile Overrides ===== */
    @media (max-width: 640px) {
      .glass-card {
        padding: 16px;
        border-radius: 16px;
      }
      .modal-content {
        width: 100%;
        max-width: 100%;
        max-height: 90vh;
        border-radius: 20px 20px 0 0;
        padding: 24px 20px;
        position: fixed;
        bottom: 0;
        left: 0;
        transform: translateY(100%);
      }
      .modal-overlay.active .modal-content {
        transform: translateY(0);
      }
      .modal-overlay.active {
        align-items: flex-end;
      }
      .summary-bar {
        gap: 8px;
      }
      .summary-item {
        min-width: calc(50% - 8px);
        padding: 8px 12px;
      }
      .summary-item .value {
        font-size: 1rem;
      }
      .stocks-grid:not(.compact) {
        gap: 14px;
      }
      .category-header {
        padding: 8px 0;
      }
      .category-name {
        font-size: 1rem;
      }
      .desktop-only {
        display: none !important;
      }
      .table-view th, .table-view td {
        padding: 10px 10px;
      }
      .table-view .td-name {
        max-width: 120px;
      }
      .table-stock-code, .td-since, .td-reason-col {
        display: none;
      }
      .td-notes .notes-content {
        max-width: 100px;
        font-size: 0.78rem;
      }
      .compact-card .stats-row {
        gap: 10px;
      }
      .stocks-grid.compact {
        gap: 10px;
      }
      .ticker-container {
        padding: 8px 0;
        margin-bottom: 10px;
      }
      .ticker-track {
        gap: 20px;
        animation-duration: 20s;
      }
      .ticker-item {
        padding: 2px 8px;
        gap: 4px;
      }
      .ticker-name, .ticker-price { font-size: 0.75rem; }
      .ticker-change { font-size: 0.7rem; }
      .detail-sheet {
        padding: 20px 16px 28px;
        max-height: 80vh;
      }
      .detail-sheet .grid { gap: 10px; }
      .detail-sheet .glass-card { padding: 12px !important; }
    }
    @media (min-width: 641px) {
      .mobile-only {
        display: none !important;
      }
      .mobile-nav-title {
        display: none;
      }
    }
    /* Tablet */
    @media (min-width: 641px) and (max-width: 1024px) {
      .stocks-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .stocks-grid.compact {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Category manage grid */
    .category-list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
    }
    .theme-light .category-list-item { border-bottom: 1px solid rgba(0,0,0,0.04); }
    .theme-dark .category-list-item { border-bottom: 1px solid rgba(255,255,255,0.04); }
    .category-list-item:last-child { border-bottom: none; }

    /* High profit glow effect */
    .glass-card.profit-glow {
      box-shadow: 0 8px 32px rgba(34,197,94,0.1);
    }
    .glass-card.loss-glow {
      box-shadow: 0 8px 32px rgba(239,68,68,0.08);
    }

    /* Mobile hamburger */
    .hamburger-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background 0.2s;
      background: rgba(99,102,241,0.1);
      flex-shrink: 0;
    }
    .hamburger-btn span {
      display: block;
      width: 20px;
      height: 2px;
      border-radius: 1px;
      transition: all 0.3s;
    }
    .theme-light .hamburger-btn span { background: #1a1a2e; }
    .theme-dark .hamburger-btn span { background: #e2e8f0; }

    /* Drag handle for category headers */
    .category-drag-handle {
      cursor: grab;
      font-size: 1rem;
      opacity: 0.35;
      transition: opacity 0.2s, transform 0.2s;
      user-select: none;
      flex-shrink: 0;
      width: 24px;
      text-align: center;
      line-height: 1;
    }
    .category-header:hover .category-drag-handle {
      opacity: 0.8;
    }
    .category-drag-handle:active {
      cursor: grabbing;
      opacity: 1;
      transform: scale(1.1);
    }
    .category-header.dragging-over {
      background: rgba(99,102,241,0.08);
      border-radius: 8px;
      padding-left: 8px;
      padding-right: 8px;
    }

    /* Notes in table view - prominent */
    .td-notes {
      font-size: 0.85rem;
      font-weight: 600;
    }
    .td-notes .notes-content {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }
    .td-notes .notes-empty {
      opacity: 0.3;
      font-weight: 400;
    }

    /* Dragging state */
    .cat-dragging {
      opacity: 0.3;
    }
  </style>
</head>
<body :class="'theme-' + theme">
  
  <!-- Toast Notification -->
  <div id="toast" class="toast" x-text="toastMessage" :class="'toast-' + toastType + (toastVisible ? ' show' : '')"></div>

  <!-- Desktop Navigation -->
  <nav class="glass-nav desktop-only">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="text-3xl">📈</span>
          <div>
            <h1 class="text-2xl font-bold gradient-text">股票追踪助手</h1>
            <p class="text-sm stat-label" x-text="`追踪 ${stocks.length} 只股票 · 最后更新: ${lastUpdated}`"></p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <!-- View Mode Toggle -->
          <div class="view-toggle mr-1">
            <button @click="setViewMode('compact')" class="view-toggle-btn" :class="viewMode === 'compact' ? 'active' : ''" title="紧凑模式">
              <span>☰</span>
            </button>
            <button @click="setViewMode('table')" class="view-toggle-btn" :class="viewMode === 'table' ? 'active' : ''" title="列表模式">
              <span>⊞</span>
            </button>
          </div>
          <button @click="openCategoryModal()" class="btn-secondary flex items-center gap-1.5 text-sm py-2 px-3">
            <span>🏷️</span>
            <span class="hidden sm:inline">分类管理</span>
          </button>
          <button @click="toggleTunnel()" class="btn-secondary flex items-center gap-1.5 text-sm py-2 px-3" :title="tunnelUrl ? '外部地址: ' + tunnelUrl : '生成对外访问地址'">
            <span :class="tunnelUrl ? '' : 'opacity-50'">🌐</span>
            <span class="hidden sm:inline" x-text="tunnelUrl ? '已分享' : '对外分享'"></span>
          </button>
          <!-- Import/Export -->
          <div class="relative" x-data="{ open: false }">
            <button @click="open = !open" class="btn-secondary flex items-center gap-1.5 text-sm py-2 px-3" title="数据导入导出">
              <span>💾</span>
              <span class="hidden sm:inline">数据</span>
            </button>
            <div x-show="open" @click.away="open = false"
                 class="category-picker" style="right:0;top:100%;margin-top:4px;min-width:160px;">
              <div @click="open = false; exportData()" class="category-option">
                <span>📤</span>
                <span>导出数据 (JSON)</span>
              </div>
              <div @click="open = false; document.getElementById('importFileInput').click()" class="category-option">
                <span>📥</span>
                <span>导入数据 (JSON)</span>
              </div>
            </div>
            <input type="file" id="importFileInput" accept=".json" @change="importData($event)" style="display:none;">
          </div>
          <button @click="refreshAll()" :disabled="isRefreshing" class="btn-secondary flex items-center gap-1.5 text-sm py-2 px-3">
            <span x-show="isRefreshing" class="spinner" style="width:16px;height:16px;"></span>
            <span x-show="!isRefreshing">🔄</span>
            <span class="hidden sm:inline" x-text="isRefreshing ? '更新中...' : '刷新'"></span>
          </button>
          <button @click="toggleTheme()" class="theme-toggle-btn" x-html="theme === 'dark' ? '☀️' : '🌙'"></button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Mobile Navigation -->
  <nav class="glass-nav-mobile mobile-only" style="padding:12px 0;position:sticky;top:0;z-index:50;">
    <div class="flex items-center justify-between px-4">
      <div class="flex items-center gap-2 min-w-0">
        <span class="text-xl flex-shrink-0">📈</span>
        <div class="min-w-0">
          <h1 class="text-base font-bold gradient-text truncate">股票追踪助手</h1>
          <p class="text-xs stat-label truncate" x-text="`${stocks.length} 只 · ${lastUpdated}`"></p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button @click="openAddModal()" class="btn-primary" style="padding:8px 14px;font-size:0.85rem;">
          <span>＋</span>
          <span>添加</span>
        </button>
        <button @click="mobileMenuOpen = !mobileMenuOpen" class="hamburger-btn">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Mobile Menu Sidebar -->
  <div class="mobile-menu-overlay" :class="mobileMenuOpen ? 'active' : ''" @click="mobileMenuOpen = false"></div>
  <div class="mobile-menu-panel" :class="mobileMenuOpen ? 'active' : ''">
    <div class="flex items-center justify-between mb-6">
      <span class="font-bold text-lg gradient-text">菜单</span>
      <button @click="mobileMenuOpen = false" class="text-xl opacity-40 hover:opacity-70">✕</button>
    </div>
    
    <div class="space-y-1 mb-4">
      <p class="text-xs stat-label px-4 mb-2">显示模式</p>
      <div class="flex gap-2 px-4 mb-4">
        <button @click="setViewMode('compact'); mobileMenuOpen = false" class="view-toggle-btn flex-1 justify-center" :class="viewMode === 'compact' ? 'active' : ''">☰ 紧凑</button>
        <button @click="setViewMode('table'); mobileMenuOpen = false" class="view-toggle-btn flex-1 justify-center" :class="viewMode === 'table' ? 'active' : ''">⊞ 列表</button>
      </div>
    </div>

    <div class="space-y-1">
      <button @click="openCategoryModal(); mobileMenuOpen = false" class="mobile-menu-item">
        <span>🏷️</span>
        <span>分类管理</span>
      </button>
      <button @click="toggleTunnel(); mobileMenuOpen = false" class="mobile-menu-item">
        <span>🌐</span>
        <span x-text="tunnelUrl ? '复制分享链接' : '对外分享'"></span>
      </button>
      <button @click="mobileMenuOpen = false; exportData()" class="mobile-menu-item">
        <span>📤</span>
        <span>导出数据</span>
      </button>
      <button @click="mobileMenuOpen = false; document.getElementById('importFileInput').click()" class="mobile-menu-item">
        <span>📥</span>
        <span>导入数据</span>
      </button>
      <button @click="refreshAll(); mobileMenuOpen = false" class="mobile-menu-item" :disabled="isRefreshing">
        <span>🔄</span>
        <span x-text="isRefreshing ? '更新中...' : '刷新价格'"></span>
      </button>
      <button @click="toggleTheme(); mobileMenuOpen = false" class="mobile-menu-item">
        <span x-text="theme === 'dark' ? '☀️' : '🌙'"></span>
        <span x-text="theme === 'dark' ? '浅色模式' : '深色模式'"></span>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
    
    <!-- Scrolling Stock Ticker -->
    <div x-show="!loading && stocks.length > 0" class="ticker-container">
      <div class="ticker-track">
        <template x-for="stock in sortedStocks" :key="'t-'+stock.id">
          <div class="ticker-item" :class="stock.alert_triggered ? 'alert-triggered' : ''" @click="openDetail(stock)">
            <span class="ticker-name" x-text="stock.name"></span>
            <span x-show="stock.tag" class="stock-tag" :class="stock.tag" x-text="stock.tag"></span>
            <span class="ticker-price" x-text="formatPrice(stock.current_price)"></span>
            <span class="ticker-change" :class="(stock.daily_change || 0) >= 0 ? 'up' : 'down'" x-text="formatPercent(stock.daily_change)"></span>
            <span class="ticker-sep"></span>
          </div>
        </template>
        <template x-for="stock in sortedStocks" :key="'t2-'+stock.id">
          <div class="ticker-item" :class="stock.alert_triggered ? 'alert-triggered' : ''" @click="openDetail(stock)">
            <span class="ticker-name" x-text="stock.name"></span>
            <span x-show="stock.tag" class="stock-tag" :class="stock.tag" x-text="stock.tag"></span>
            <span class="ticker-price" x-text="formatPrice(stock.current_price)"></span>
            <span class="ticker-change" :class="(stock.daily_change || 0) >= 0 ? 'up' : 'down'" x-text="formatPercent(stock.daily_change)"></span>
            <span class="ticker-sep"></span>
          </div>
        </template>
      </div>
    </div>

    <!-- Notes Scrolling Ticker (stocks with personal notes) -->
    <div x-show="!loading && stocksWithNotes.length > 0" class="ticker-container" style="padding:6px 0;margin-bottom:10px;">
      <div class="ticker-track" style="animation-duration:40s;">
        <template x-for="stock in stocksWithNotes" :key="'n-'+stock.id">
          <div class="ticker-item" @click="openDetail(stock)">
            <span style="font-size:0.75rem;opacity:0.6;">📝</span>
            <span class="ticker-name" style="font-size:0.8rem;" x-text="stock.name"></span>
            <span style="font-size:0.8rem;color:#f59e0b;max-width:180px;overflow:hidden;text-overflow:ellipsis;" x-text="'📌 ' + stock.notes_sub"></span>
            <span class="ticker-sep"></span>
          </div>
        </template>
        <template x-for="stock in stocksWithNotes" :key="'n2-'+stock.id">
          <div class="ticker-item" @click="openDetail(stock)">
            <span style="font-size:0.75rem;opacity:0.6;">📝</span>
            <span class="ticker-name" style="font-size:0.8rem;" x-text="stock.name"></span>
            <span style="font-size:0.8rem;color:#f59e0b;max-width:180px;overflow:hidden;text-overflow:ellipsis;" x-text="'📌 ' + stock.notes_sub"></span>
            <span class="ticker-sep"></span>
          </div>
        </template>
      </div>
    </div>

    <!-- Stock Detail Sheet -->
    <div class="detail-overlay" :class="detailStock ? 'active' : ''" @click="closeDetail()"></div>
    <div class="detail-sheet" :class="detailStock ? 'active' : ''">
      <div class="handle"></div>
      <template x-if="detailStock">
        <div>
          <!-- Header -->
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-xl font-bold" x-text="detailStock.name"></span>
              <span x-show="detailStock.tag" class="stock-tag" :class="detailStock.tag" x-text="detailStock.tag"></span>
              <span class="market-tag" :class="'market-' + detailStock.market" x-text="detailStock.market.toUpperCase()"></span>
              <span class="stat-label text-sm" x-text="detailStock.code"></span>
              <span x-show="detailStock.alert_triggered" class="alert-badge">⚠️ 预警</span>
            </div>
            <button @click="closeDetail()" class="text-2xl opacity-40 hover:opacity-70">✕</button>
          </div>

          <!-- Price -->
          <div class="flex items-baseline gap-3 mb-5">
            <span class="text-3xl font-bold" x-text="formatPrice(detailStock.current_price)"></span>
            <span class="text-lg font-semibold" :class="(detailStock.daily_change || 0) >= 0 ? 'price-up' : 'price-down'"
                  x-text="formatPercent(detailStock.daily_change)"></span>
          </div>

          <!-- Info grid -->
          <div class="grid grid-cols-2 gap-4">
            <div class="glass-card !p-4" style="border-radius:12px;">
              <p class="text-xs stat-label mb-1">📅 加入日期</p>
              <p class="font-semibold text-sm" x-text="detailStock.join_date || '--'"></p>
            </div>
            <div class="glass-card !p-4" style="border-radius:12px;">
              <p class="text-xs stat-label mb-1">💰 加入价格</p>
              <p class="font-semibold text-sm" x-text="formatPrice(detailStock.added_price)"></p>
            </div>
            <div class="glass-card !p-4" style="border-radius:12px;">
              <p class="text-xs stat-label mb-1">📈 加入至今涨幅</p>
              <p class="font-semibold text-sm" :class="detailStock.change_percent >= 0 ? 'price-up' : 'price-down'"
                 x-text="formatPercent(detailStock.change_percent)"></p>
            </div>
            <div class="glass-card !p-4" style="border-radius:12px;">
              <p class="text-xs stat-label mb-1">🏷️ 标签</p>
              <p class="font-semibold text-sm">
                <span x-show="detailStock.tag" class="stock-tag" :class="detailStock.tag" x-text="detailStock.tag"></span>
